function buildStandings(games) {
  const s = {};
  const init = t => { if(!s[t]) s[t]={team:t,mp:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}; };
  games.filter(g=>g.status==="final").forEach(g=>{
    const h=g.home,a=g.away,hs=g.score[h],as=g.score[a];
    init(h);init(a);
    s[h].mp++;s[a].mp++;s[h].gf+=hs;s[h].ga+=as;s[a].gf+=as;s[a].ga+=hs;
    if(hs>as){s[h].w++;s[h].pts+=3;s[a].l++;}
    else if(hs<as){s[a].w++;s[a].pts+=3;s[h].l++;}
    else{s[h].d++;s[a].d++;s[h].pts++;s[a].pts++;}
  });
  return s;
}
function sortGroup(teams,stats){
  return teams.map(t=>stats[t]||{team:t,mp:0,w:0,d:0,l:0,gf:0,ga:0,pts:0})
    .sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
}

// ===================== Googleスプレッドシート連携 =====================
// 公開（リンクを知っている全員が閲覧可）のスプレッドシートを想定し、
// gvizのCSVエンドポイントをfetchして取得する。認証が必要な非公開シートの場合は、
// Google Sheets API（APIキー or OAuth）経由に切り替える必要がある。
const FULLWIDTH_DIGIT = {"１":1,"２":2,"３":3,"４":4};

function extractSheetId(input) {
  if(!input) return "";
  const m = String(input).match(/\/d\/([a-zA-Z0-9-_]+)/);
  return m ? m[1] : input.trim();
}

function parseCSV(text) {
  // 簡易CSVパーサ（ダブルクオート・カンマ・改行を含むセルに対応）
  const rows = [];
  let row = [], cell = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ cell += '"'; i++; }
        else inQuotes = false;
      } else cell += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(cell); cell = ""; }
      else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ""; }
      else if(c === '\r'){ /* skip */ }
      else cell += c;
    }
  }
  row.push(cell); rows.push(row);
  return rows;
}

async function fetchSheetCSV(spreadsheetId, sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  if(!res.ok){
    if(res.status === 400 || res.status === 404) throw new Error(`シート「${sheetName}」が見つかりません。タブ名を確認してください。`);
    throw new Error(`読み込みに失敗しました（HTTP ${res.status}）。共有設定が「リンクを知っている全員が閲覧可」になっているか確認してください。`);
  }
  return res.text();
}

// 「投票シート」の固定レイアウト（行1=投票者名, 行2=投票日, 行3=賭けコジー額, 行4=列見出し,
//  行5以降=グループ/出場国/(1)〜(4)の予想マーク）をパースしてALL_PREDICTIONS形式に変換する。
function parseVotePredictions(rows) {
  const headerRowIdx = rows.findIndex(r => (r[2]||"").trim() === "出場国");
  if(headerRowIdx < 0) throw new Error("「出場国」列が見つかりません。投票シートのフォーマットと一致しないようです。");
  const namesRow = rows[headerRowIdx-3] || [];
  const datesRow  = rows[headerRowIdx-2] || [];
  const stakeRow  = rows[headerRowIdx-1] || [];
  const dataRows = [];
  for(let r = headerRowIdx+1; r<rows.length; r++){
    const row = rows[r];
    if(!row || !(row[2]||"").trim()) break;
    dataRows.push(row);
  }
  const fmtDate = v => {
    if(!v) return "";
    const m = String(v).match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
    return String(v).trim();
  };
  // 「500コジー」のような文字列から数字だけを取り出す。未入力なら0。
  const parseStake = v => {
    const digits = String(v||"").replace(/[^\d]/g,"");
    return digits ? parseInt(digits,10) : 0;
  };
  const entries = [];
  const maxCol = Math.max(namesRow.length, ...dataRows.map(r=>r.length));
  for(let c=4;c<maxCol;c++){
    const voter = (namesRow[c]||"").trim();
    if(!voter) continue;
    const picks = {};
    dataRows.forEach(row=>{
      const cell = (row[c]||"").trim();
      const m = cell.match(/[（(]([１２３４])[）)]/);
      if(m){
        const pos = FULLWIDTH_DIGIT[m[1]];
        picks[pos] = jpToCode(row[2]);
      }
    });
    if(picks[1]||picks[2]||picks[3]||picks[4]){
      entries.push({
        name: voter,
        date: fmtDate(datesRow[c]),
        p1: picks[1]||"", p2: picks[2]||"", p3: picks[3]||"", p4: picks[4]||"",
        stake: parseStake(stakeRow[c]),
      });
    }
  }
  return entries;
}

function useSheetSource() {
  const [config, setConfig] = useState(()=>{
    try {
      const saved = JSON.parse(localStorage.getItem("fifa2026_sheetConfig")||"null");
      if(saved) return saved;
    } catch(e){}
    return { spreadsheetId:"", tabs:["投票シート"], activeTab:"投票シート" };
  });
  const [mode, setMode] = useState(()=>localStorage.getItem("fifa2026_sourceMode") || "hardcoded");
  const [status, setStatus] = useState("idle"); // idle | loading | success | error
  const [error, setError] = useState("");
  const [entries, setEntries] = useState(null);

  useEffect(()=>{ localStorage.setItem("fifa2026_sheetConfig", JSON.stringify(config)); }, [config]);
  useEffect(()=>{ localStorage.setItem("fifa2026_sourceMode", mode); }, [mode]);

  const load = async () => {
    if(!config.spreadsheetId){ setError("スプレッドシートのIDまたはURLを入力してください。"); setStatus("error"); return; }
    setStatus("loading"); setError("");
    try {
      const id = extractSheetId(config.spreadsheetId);
      const csv = await fetchSheetCSV(id, config.activeTab);
      const rows = parseCSV(csv);
      const parsed = parseVotePredictions(rows);
      if(parsed.length === 0) throw new Error("有効な予想データが0件でした。タブ名・シート構成を確認してください。");
      setEntries(parsed);
      setStatus("success");
    } catch(e){
      setError(e.message || String(e));
      setStatus("error");
    }
  };

  const addTab = (tabName) => {
    const name = tabName.trim();
    if(!name) return;
    setConfig(c => c.tabs.includes(name) ? c : { ...c, tabs:[...c.tabs, name] });
  };
  const removeTab = (tabName) => {
    setConfig(c => ({ ...c, tabs: c.tabs.filter(t=>t!==tabName), activeTab: c.activeTab===tabName ? (c.tabs.find(t=>t!==tabName)||"") : c.activeTab }));
  };

  return { config, setConfig, mode, setMode, status, error, entries, load, addTab, removeTab };
}

const T = {

  muted:"#446644",dim:"#335533",

function useBreakpoint() {
  const [w, setW] = useState(window.innerWidth);
  useEffect(()=>{
    const h = ()=>setW(window.innerWidth);
    window.addEventListener("resize",h);
    return()=>window.removeEventListener("resize",h);
  },[]);
  return { isMobile:w<640, isTablet:w>=640&&w<1024, isDesktop:w>=1024, w };
}

// ===================== 試合結果（scores.json）連携 =====================
// football-data.orgはブラウザからの直接fetchをCORSで許可していない
// （トークンに紐づくAllow-Originがlocalhost固定で返ってくる）ため、
// GitHub Actions（.github/workflows/update-scores.yml）がサーバー側で定期的に
// football-data.orgを叩き、結果をリポジトリ内の scores.json に書き出している。
// アプリは同一オリジンの scores.json を読むだけなので、CORSの問題が発生しない。
function useLiveScores() {
  const [games, setGames] = useState(SEED_GAMES);
  const [status, setStatus] = useState("idle"); // idle / loading / success / error
  const [error, setError] = useState(null);
  const [lastUpdated, setLastUpdated] = useState(null);

  const load = async () => {
    setStatus("loading"); setError(null);
    try {
      const res = await fetch(`scores.json?t=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`scores.json の取得に失敗しました（HTTP ${res.status}）`);
      const data = await res.json();
      if (data.games && data.games.length) {
        setGames(data.games);
        setStatus("success");
        setLastUpdated(data.updatedAt ? new Date(data.updatedAt) : new Date());
      } else {
        setStatus("error");
        setError("scores.jsonがまだ更新されていません（GitHub Actionsの初回実行待ちかもしれません）。");
      }
    } catch (e) {
      setStatus("error");
      setError(e.message || "取得に失敗しました。");
    }
  };

  return { games, status, error, lastUpdated, load };
}

// =================== 得点ランキング連携 ===================
// football-data.orgの/scorersはコンペティションやプランによって対応していない場合があるため、
// scorers.jsonが存在しない・空でも、エラー表示はせず「未対応」として静かに扱う。
function useScorers() {
  const [scorers, setScorers] = useState([]);
  const [status, setStatus] = useState("idle"); // idle / loading / success / unavailable

  const load = async () => {
    setStatus("loading");
    try {
      const res = await fetch(`scorers.json?t=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) { setStatus("unavailable"); return; }
      const data = await res.json();
      if (data.scorers && data.scorers.length) {
        setScorers(data.scorers);
        setStatus("success");
      } else {
        setStatus("unavailable");
      }
    } catch (e) {
      setStatus("unavailable");
    }
  };

  return { scorers, status, load };
}

// /scorersと同様、APIの契約プランによってはteams.jsonが取得できない・空の場合があるため、

function useTeams() {

// 試合結果の再取得サイクル（秒）。更新頻度を上げたい場合はここだけ変更すればよい。
const REFRESH_INTERVAL_SEC = 30 * 60;

// 独立したコンポーネントとして切り出すことで、毎秒のカウントダウン更新が
// App全体（および配下のタブ・パネル）を再レンダリングしないようにしている。
// もしApp直下でuseState/setIntervalしていると、Appが毎秒再レンダリングされ、
// その中で定義されたコンポーネント（例：データソースパネル）が毎回新しい関数として
// 生成され直し、Reactがそれを「別コンポーネント」と見なして毎秒マウント解除→再マウントしてしまう。
// その結果、開いたつもりのトグルや入力中のテキストが1秒後に初期状態へリセットされていた。
function useAutoRefresh(onTick) {
  useEffect(()=>{
    const iv = setInterval(()=>onTick && onTick(), REFRESH_INTERVAL_SEC*1000);
    return ()=>clearInterval(iv);
  },[onTick]);
}

  useEffect(()=>{ live.load(); scorers.load(); teams.load(); },[]); // eslint-disable-line
  useAutoRefresh(live.load);
  useAutoRefresh(scorers.load);
  useAutoRefresh(teams.load);
  // スプレッドシート連携が有効な間は、投票データも自動的に再取得する。
  useAutoRefresh(()=>{ if(sheet.mode==="sheet") sheet.load(); });

  // ヘッダーの実高さを測って使う。CSSのzoom（PC幅で見た目を拡大している）の影響で
  // 見た目上の高さがCSSで指定した値と一致しないため、決め打ちの数値ではなく
  // 実測値をSELECT GROUPサイドバーのスクロール計算に使う。
  useEffect(()=>{
    if(!headerRef.current) return;
    const update = () => setHeaderH(headerRef.current.getBoundingClientRect().height);
    update();
    const ro = new ResizeObserver(update);
    ro.observe(headerRef.current);
    return () => ro.disconnect();
  },[]);

  const allStats = buildStandings(games);

  // 優勝/準優勝/3位/4位は、football-data.orgが配信する決勝・3位決定戦の結果
  // （stageがFINAL/THIRD_PLACE）から自動的に確定させる。両試合とも終了するまではnullのまま。
  const winnerOf = g => {
    if(!g || g.status!=="final") return null;
    if(g.winner==="home") return g.home;
    if(g.winner==="away") return g.away;
    if(g.score[g.home]===g.score[g.away]) return null; // PK結果が取れずフルタイム同点のままなら判定不能
    return g.score[g.home] > g.score[g.away] ? g.home : g.away;
  };
  const finalGame = games.find(g=>g.stage==="FINAL");
  const thirdGame = games.find(g=>g.stage==="THIRD_PLACE");
  const champion = winnerOf(finalGame);
  const runnerUp = finalGame && champion ? (champion===finalGame.home ? finalGame.away : finalGame.home) : null;
  const third    = winnerOf(thirdGame);
  const fourth   = thirdGame && third ? (third===thirdGame.home ? thirdGame.away : thirdGame.home) : null;
  const finalResult = {1:champion, 2:runnerUp, 3:third, 4:fourth};

  // シート連携が有効＆データ取得済みならそちらを使い、それ以外はハードコードのサンプルデータを使う。
  const activePredictions = (sheet.mode === "sheet" && sheet.entries) ? sheet.entries : ALL_PREDICTIONS;

  const scoredEntries = activePredictions.map((p,idx)=>{
    let score=0,maxP=0,alive=0,dead=0;
    [[p.p1,1],[p.p2,2],[p.p3,3],[p.p4,4]].forEach(([t,pos])=>{
      if(finalResult[pos]){ if(finalResult[pos]===t) score++; }
      else if(STILL_ALIVE.has(t)) maxP++;
      if(STILL_ALIVE.has(t)) alive++;
      if(ELIMINATED.has(t)) dead++;
    });
    return {...p, idx, score, maxPoss:score+maxP, alive, dead};
  }).sort((a,b)=>b.score-a.score||b.maxPoss-a.maxPoss||b.alive-a.alive);

  const personMap = {};
  scoredEntries.forEach(e=>{
    if(!personMap[e.name]) personMap[e.name]={name:e.name,entries:[],bestScore:0,totalEntries:0,earliestDate:e.date};
    personMap[e.name].entries.push(e);

  });
  const personRanked = Object.values(personMap)

  // 1〜4位の予想（4つ全て）が完全に一致するエントリーをグルーピングしておき、

                  <td onClick={()=>setST(s.team)} style={{padding:"7px 6px",color:elim?T.red:"#d0eed0",fontFamily:T.font,fontWeight:600,fontSize:"13px",cursor:"pointer"}}>

                </tr>

        </table>
      </div>

    const MatchList = ({grp}) => (
      <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:"6px",overflow:"hidden"}}>
        <div style={{background:"#0a120a",padding:"7px 12px",fontFamily:T.font,fontSize:"11px",letterSpacing:"2px",color:T.green,fontWeight:700,borderBottom:`1px dashed ${T.green}33`}}>⚽ MATCHES</div>
        {grpGames(grp).length===0
          ?<div style={{padding:"16px",color:T.dim,textAlign:"center",fontSize:"12px"}}>このグループの試合データなし</div>
          :grpGames(grp).map((g,i)=><MatchRow key={i} game={g}/>)}
      </div>
    );
    const GroupBtn = ({g}) => (
      <button onClick={()=>setAG(g)} style={{padding:bp.isDesktop?"8px 12px":"5px 12px",border:"none",borderRadius:bp.isDesktop?"5px":"3px",cursor:"pointer",fontFamily:T.font,fontSize:"12px",fontWeight:700,background:activeGroup===g?T.green:"#111d11",color:activeGroup===g?"#080e08":T.muted,transition:"all 0.12s",textAlign:"left",borderLeft:`3px solid ${activeGroup===g?T.green:T.border}`}}>
        {bp.isDesktop
          ? <><div style={{letterSpacing:"1px"}}>GROUP {g}</div><div style={{display:"flex",gap:"4px",marginTop:"3px"}}>{sortGroup(GROUP_TEAMS[g],allStats).map((s,i)=><span key={s.team} style={{fontSize:"9px",fontWeight:900,letterSpacing:"0.5px",opacity:i<2?1:0.4}}>{f(s.team)}</span>)}</div></>
          : `G${g}`}
      </button>

      <div style={{display:"flex",flexDirection:"column",gap:"14px"}}>
        <LiveScorePanel/>

          <div style={{position:"sticky",top:`${headerH+12}px`,display:"flex",flexDirection:"column"}}>

            <div style={{display:"flex",flexDirection:"column",gap:"5px"}}>
              {Object.keys(GROUP_TEAMS).map(g=><GroupBtn key={g} g={g}/>)}
            </div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
            <StandingsTable grp={activeGroup}/>
            <MatchList grp={activeGroup}/>
          </div>
        </div>
      </div>

    if(bp.isTablet) return (
      <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
        <LiveScorePanel/>
        <div style={{display:"flex",flexWrap:"wrap",gap:"5px"}}>{Object.keys(GROUP_TEAMS).map(g=><GroupBtn key={g} g={g}/>)}</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px",alignItems:"start"}}>
          <StandingsTable grp={activeGroup}/><MatchList grp={activeGroup}/>
        </div>
      </div>
    );
    return (
      <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
        <LiveScorePanel/>
        <div style={{display:"flex",flexWrap:"wrap",gap:"5px"}}>{Object.keys(GROUP_TEAMS).map(g=><GroupBtn key={g} g={g}/>)}</div>
        <StandingsTable grp={activeGroup}/><MatchList grp={activeGroup}/>
      </div>
    );
  };

  // ===================== BRACKET TAB（外側→中央 収束トーナメント表） =====================
  const BracketTab = () => {
    // 自分でグループ順位から組み合わせを推測するのはやめて、football-data.orgが
    // 確定させた決勝トーナメントの対戦（stageがGROUP_STAGE以外の試合）をそのまま使う。
    // FIFAが組み合わせを確定するまではAPI側にも試合が出てこないので、自然にTBD表示になる。
    const byStage = stage => games
      .filter(g => g.stage === stage)
      .sort((a,b) => (a.id||0) - (b.id||0))
      .map(g => ({a:g.home, b:g.away}));
    const padTo = (arr, n) => Array.from({length:n}, (_,i) => arr[i] || {a:null,b:null});

    const r16 = padTo(byStage("LAST_16"), 8);
    const qf  = padTo(byStage("QUARTER_FINALS"), 4);
    const sf  = padTo(byStage("SEMI_FINALS"), 2);
    const final = padTo(byStage("FINAL"), 1);

    const r16L=r16.slice(0,4), r16R=r16.slice(4,8);
    const qfL=qf.slice(0,2), qfR=qf.slice(2,4);
    const sfL=sf.slice(0,1), sfR=sf.slice(1,2);

    const BOX_H = 52, COL_W = 132, CONN_W = 26, H = 420;

    const MatchBox = ({m}) => (
      <div style={{height:BOX_H+"px",width:COL_W+"px",flexShrink:0,background:T.surface,border:`1px solid ${T.border}`,borderRadius:"4px",overflow:"hidden",display:"flex",flexDirection:"column"}}>
        {[m?.a,m?.b].map((t,i)=>(
          <div key={i} style={{flex:1,display:"flex",alignItems:"center",gap:"5px",padding:"0 8px",borderBottom:i===0?`1px solid ${T.border}`:"none"}}>
            {t
              ? <span title={nm(t)} onClick={()=>setST(t)} style={{display:"flex",alignItems:"center",gap:"5px",overflow:"hidden",cursor:"pointer"}}><span style={{fontFamily:T.font,fontSize:"9px",fontWeight:900,color:T.dim,flexShrink:0,letterSpacing:"0.5px"}}>{f(t)}</span><span style={{fontFamily:T.font,fontSize:"10px",fontWeight:700,color:"#aacaaa",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{nm(t)}</span></span>
              : <span style={{fontFamily:T.font,fontSize:"10px",color:T.dim}}>TBD</span>}
          </div>
        ))}
      </div>
    );

    const RoundCol = ({matches}) => (
      <div style={{display:"flex",flexDirection:"column",justifyContent:matches.length===1?"center":"space-around",height:H+"px",width:COL_W+"px",flexShrink:0}}>
        {matches.map((m,i)=><MatchBox key={i} m={m}/>)}
      </div>
    );

    const ConnCol = ({count, side}) => (
      <div style={{display:"flex",flexDirection:"column",height:H+"px",width:CONN_W+"px",flexShrink:0}}>
        {Array.from({length:count}).map((_,i)=>(
          <div key={i} style={{flex:1,position:"relative"}}>
            <div style={{position:"absolute",[side==="left"?"left":"right"]:0,top:"25%",bottom:"25%",width:"2px",background:T.border}}/>
            <div style={{position:"absolute",top:"50%",left:0,right:0,height:"2px",background:T.border}}/>
          </div>
        ))}
      </div>
    );

    const desktopMin = COL_W*7 + CONN_W*6 + 40;

    return (
      <div style={{display:"flex",flexDirection:"column",gap:"14px"}}>
        <div style={{padding:"10px 14px",background:"rgba(240,192,64,0.05)",border:"1px solid rgba(240,192,64,0.15)",borderRadius:"6px",fontFamily:T.font,fontSize:"11px",color:"#887744",lineHeight:1.7}}>
          🏆 グループ順位から自動でベスト16を生成。各カードの勝者が決まると、線をたどって次のラウンドのカードへ自動的に反映されます。決勝の勝者がそのまま優勝チームです。
        </div>
        <div style={{overflowX:"auto",paddingBottom:"8px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",minWidth:desktopMin+"px",padding:"24px 0"}}>
            {/* LEFT HALF */}
            <RoundCol matches={r16L}/>
            <ConnCol count={2} side="left"/>
            <RoundCol matches={qfL}/>
            <ConnCol count={1} side="left"/>
            <RoundCol matches={sfL}/>
            <ConnCol count={1} side="left"/>

            {/* CENTER: FINAL + CHAMPION */}
            <div style={{height:H+"px",width:COL_W+"px",flexShrink:0,position:"relative",display:"flex",alignItems:"center",justifyContent:"center"}}>
              <div style={{position:"absolute",bottom:"50%",marginBottom:"18px",display:"flex",flexDirection:"column",alignItems:"center",width:"100%"}}>
                <div style={{fontSize:"26px",marginBottom:"2px"}}>👑</div>
                <div style={{width:COL_W+"px",padding:"6px 8px",background:"rgba(240,192,64,0.08)",border:`1px solid ${T.yellow}`,borderRadius:"4px",textAlign:"center"}}>
                  <span style={{fontFamily:T.font,fontSize:"10px",letterSpacing:"1px",color:T.yellow,fontWeight:700}}>CHAMPION</span>
                </div>
                <div style={{width:"2px",height:"18px",background:T.border,marginTop:"-1px"}}/>
              </div>
              <MatchBox m={final[0]}/>
            </div>

            {/* RIGHT HALF (mirrored) */}
            <ConnCol count={1} side="right"/>
            <RoundCol matches={sfR}/>
            <ConnCol count={1} side="right"/>
            <RoundCol matches={qfR}/>
            <ConnCol count={2} side="right"/>
            <RoundCol matches={r16R}/>
          </div>
        </div>
      </div>
    );
  };

  // ===================== SCHEDULE TAB（全試合を日時順に一覧） =====================
  const ScheduleTab = () => {
    const [upcomingOnly, setUpcomingOnly] = useState(false);
    const sorted = [...games].sort((a,b)=>{
      if(a.date && b.date) return new Date(a.date)-new Date(b.date);
      if(a.date) return -1;
      if(b.date) return 1;
      return (a.id||0)-(b.id||0);
    });
    // 「今後の予定」は、まだ終わっていない（final以外の）試合に限定する。
    const filtered = upcomingOnly ? sorted.filter(g=>g.status!=="final") : sorted;
    return (
      <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
        <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:"6px",overflow:"hidden"}}>
          <div style={{background:"#0a120a",padding:"7px 12px",fontFamily:T.font,fontSize:"11px",letterSpacing:"2px",color:T.green,fontWeight:700,borderBottom:`1px dashed ${T.green}33`,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <span>📅 {upcomingOnly?"UPCOMING MATCHES":"ALL MATCHES"}</span>
            <button onClick={()=>setUpcomingOnly(u=>!u)} style={{fontFamily:T.font,fontSize:"10px",fontWeight:700,letterSpacing:"1px",color:upcomingOnly?"#080e08":T.green,background:upcomingOnly?T.green:"transparent",border:`1px solid ${T.green}`,borderRadius:"4px",padding:"3px 8px",cursor:"pointer"}}>
              {upcomingOnly?"✓ 今後の予定のみ":"今後の予定のみ"}
            </button>
          </div>
          {filtered.length===0
            ?<div style={{padding:"16px",color:T.dim,textAlign:"center",fontSize:"12px"}}>試合データなし</div>
            :filtered.map((g,i)=><MatchRow key={i} game={g}/>)}
        </div>
      </div>
    );
  };

  // ===================== SCORERS TAB（得点ランキング） =====================
  const ScorersTab = () => (
    <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
      <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:"6px",overflow:"hidden"}}>
        <div style={{background:"#0a120a",padding:"7px 12px",fontFamily:T.font,fontSize:"11px",letterSpacing:"2px",color:T.green,fontWeight:700,borderBottom:`1px dashed ${T.green}33`}}>⚽ TOP SCORERS</div>
        {scorers.status==="unavailable" &&
          <div style={{padding:"16px",color:T.dim,textAlign:"center",fontSize:"12px"}}>得点ランキングは現在取得できません（APIが未対応、または未更新の可能性があります）。</div>}
        {scorers.status!=="unavailable" && scorers.scorers.length===0 &&
          <div style={{padding:"16px",color:T.dim,textAlign:"center",fontSize:"12px"}}>読み込み中、またはデータなし</div>}
        {scorers.scorers.length>0 &&
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:"12px"}}>
            <thead><tr style={{background:"#111d11"}}>
              {["#","PLAYER","TEAM","GOALS","ASSISTS"].map(h=>(
                <th key={h} style={{padding:"5px 6px",color:T.muted,fontFamily:T.font,fontWeight:700,letterSpacing:"1px",fontSize:"10px",textAlign:h==="PLAYER"?"left":"center",borderBottom:`1px solid ${T.border}`}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {scorers.scorers.map((s,i)=>(
                <tr key={i}>
                  <td style={{padding:"7px 6px",textAlign:"center",color:T.dim,fontSize:"11px"}}>{i+1}</td>
                  <td style={{padding:"7px 6px",color:"#d0eed0",fontFamily:T.font,fontWeight:600,fontSize:"13px"}}>{s.player}</td>
                  <td onClick={()=>setST(s.team)} style={{padding:"7px 6px",textAlign:"center",color:T.dim,fontSize:"11px",cursor:"pointer"}}>{s.team}</td>
                  <td style={{padding:"7px 6px",textAlign:"center",color:T.green,fontWeight:900,fontFamily:T.font,fontSize:"15px"}}>{s.goals}</td>
                  <td style={{padding:"7px 6px",textAlign:"center",color:"#7a9a7a",fontSize:"11px"}}>{s.assists}</td>
                </tr>
              ))}
            </tbody>
          </table>}
      </div>
    </div>
  );
  // =================== /BRACKET TAB ===================

  // ===================== シート連携設定パネル =====================
  const SheetSourcePanel = () => {
    const [idInput, setIdInput] = useState(sheet.config.spreadsheetId);
    const [newTab, setNewTab] = useState("");
    const [open, setOpen] = useState(sheet.mode === "sheet");

    const saveId = () => sheet.setConfig(c=>({...c, spreadsheetId: idInput}));

    return (
      <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:"6px",overflow:"hidden"}}>
        <button onClick={()=>setOpen(o=>!o)} style={{width:"100%",textAlign:"left",background:"#0a120a",border:"none",cursor:"pointer",padding:"8px 14px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontFamily:T.font,fontSize:"11px",letterSpacing:"2px",color:T.green,fontWeight:700}}>🔗 データソース設定</span>
          <span style={{fontFamily:T.font,fontSize:"10px",color:T.muted}}>{open?"▲ 閉じる":"▼ 開く"}</span>
        </button>
        {open && (
          <div style={{padding:"12px 14px",display:"flex",flexDirection:"column",gap:"10px"}}>
            <div style={{display:"flex",gap:"8px"}}>
              {[["hardcoded","📦 サンプルデータ"],["sheet","📋 Googleスプレッドシート"]].map(([key,label])=>(
                <button key={key} onClick={()=>sheet.setMode(key)} style={{flex:1,padding:"7px 10px",border:`1px solid ${sheet.mode===key?T.green:T.border}`,borderRadius:"4px",cursor:"pointer",fontFamily:T.font,fontSize:"11px",fontWeight:700,background:sheet.mode===key?"rgba(0,255,136,0.1)":"transparent",color:sheet.mode===key?T.green:T.muted}}>{label}</button>
              ))}
            </div>
            {sheet.mode==="sheet" && (
              <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
                <div>
                  <div style={{fontFamily:T.font,fontSize:"10px",color:T.muted,marginBottom:"4px"}}>スプレッドシートURL または ID（共有設定：リンクを知っている全員が閲覧可）</div>
                  <div style={{display:"flex",gap:"6px"}}>
                    <input value={idInput} onChange={e=>setIdInput(e.target.value)} placeholder="https://docs.google.com/spreadsheets/d/.../edit"
                      style={{flex:1,background:"#080e08",border:`1px solid ${T.border}`,borderRadius:"4px",padding:"7px 10px",color:"#d0eed0",fontSize:"12px"}}/>
                    <button onClick={saveId} style={{padding:"7px 12px",background:"#111d11",border:`1px solid ${T.border}`,borderRadius:"4px",color:T.muted,fontFamily:T.font,fontSize:"11px",cursor:"pointer"}}>保存</button>
                  </div>
                </div>
                <div>
                  <div style={{fontFamily:T.font,fontSize:"10px",color:T.muted,marginBottom:"4px"}}>読み込むタブ（シート）を選択</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:"6px",marginBottom:"6px"}}>
                    {sheet.config.tabs.map(t=>(
                      <div key={t} style={{display:"flex",alignItems:"center",gap:"6px",padding:"5px 10px",borderRadius:"4px",border:`1px solid ${sheet.config.activeTab===t?T.green:T.border}`,background:sheet.config.activeTab===t?"rgba(0,255,136,0.1)":"#111d11"}}>
                        <button onClick={()=>sheet.setConfig(c=>({...c,activeTab:t}))} style={{background:"none",border:"none",cursor:"pointer",color:sheet.config.activeTab===t?T.green:"#d0eed0",fontFamily:T.font,fontSize:"12px",fontWeight:700}}>{t}</button>
                        <button onClick={()=>sheet.removeTab(t)} style={{background:"none",border:"none",cursor:"pointer",color:T.red,fontSize:"11px"}}>×</button>
                      </div>
                    ))}
                  </div>
                  <div style={{display:"flex",gap:"6px"}}>
                    <input value={newTab} onChange={e=>setNewTab(e.target.value)} placeholder="新しいタブ名を入力して追加（例：投票シート）"
                      onKeyDown={e=>{ if(e.key==="Enter"){ sheet.addTab(newTab); setNewTab(""); } }}
                      style={{flex:1,background:"#080e08",border:`1px solid ${T.border}`,borderRadius:"4px",padding:"7px 10px",color:"#d0eed0",fontSize:"12px"}}/>
                    <button onClick={()=>{ sheet.addTab(newTab); setNewTab(""); }} style={{padding:"7px 12px",background:"#111d11",border:`1px solid ${T.border}`,borderRadius:"4px",color:T.muted,fontFamily:T.font,fontSize:"11px",cursor:"pointer"}}>＋ 追加</button>
                  </div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
                  <button onClick={sheet.load} disabled={sheet.status==="loading"} style={{padding:"8px 16px",background:T.green,border:"none",borderRadius:"4px",color:"#080e08",fontFamily:T.font,fontSize:"12px",fontWeight:700,cursor:"pointer",opacity:sheet.status==="loading"?0.6:1}}>
                    {sheet.status==="loading"?"読み込み中...":"⟳ シートを読み込む"}
                  </button>
                  {sheet.status==="success" && <span style={{fontFamily:T.font,fontSize:11,color:T.green}}>✓ {sheet.entries.length}件取得しました</span>}
                  {sheet.status==="error" && <span style={{fontFamily:T.font,fontSize:11,color:T.red}}>⚠ {sheet.error}</span>}
                </div>
                <div style={{fontFamily:T.font,fontSize:"10px",color:T.dim,lineHeight:1.6}}>
                  ※ 非公開のスプレッドシートを使う場合は、gviz CSV読み込みではなく Google Sheets API
                  （APIキー、もしくはOAuth2のアクセストークン）を使った取得に切り替える必要があります。
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    );
  };
  // =================== /シート連携設定パネル ===================

  // ===================== 試合結果（scores.json）状態パネル =====================
  const LiveScorePanel = () => {
    const [open, setOpen] = useState(false);
    return (
      <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:"6px",overflow:"hidden"}}>
        <button onClick={()=>setOpen(o=>!o)} style={{width:"100%",textAlign:"left",background:"#0a120a",border:"none",cursor:"pointer",padding:"8px 14px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontFamily:T.font,fontSize:"11px",letterSpacing:"2px",color:T.green,fontWeight:700}}>⚽ 試合結果の自動取得状況</span>
          <span style={{fontFamily:T.font,fontSize:"10px",color:T.muted}}>{open?"▲ 閉じる":"▼ 開く"}</span>
        </button>
        {open && (
          <div style={{padding:"12px 14px",display:"flex",flexDirection:"column",gap:"10px"}}>
            <div style={{display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap"}}>
              <span style={{fontFamily:T.font,fontSize:"10px",color:T.muted}}>⏱ {Math.round(REFRESH_INTERVAL_SEC/60)}分おきに自動更新されます</span>
              {live.status==="success" && <span style={{fontFamily:T.font,fontSize:11,color:T.green}}>✓ {live.games.length}試合（更新: {live.lastUpdated?.toLocaleString("ja-JP")}）</span>}
              {live.status==="error" && <span style={{fontFamily:T.font,fontSize:11,color:T.red}}>⚠ {live.error}</span>}
            </div>
          </div>
        )}
      </div>
    );
  };
  // =================== /試合結果パネル ===================

  const PredTab = () => {
    const allTeams=[...new Set(activePredictions.flatMap(p=>[p.p1,p.p2,p.p3,p.p4]))];
    const popularity=allTeams.map(t=>({t,n:activePredictions.filter(p=>[p.p1,p.p2,p.p3,p.p4].includes(t)).length})).sort((a,b)=>b.n-a.n);
    // 投票結果確認シートの「賭けコジー額」「人気ランキング」セクションに対応する集計。
    const totalPool=activePredictions.reduce((s,p)=>s+(p.stake||0),0);
    const stakeByPerson=uniqueNames.map(name=>({
      name,
      stake: activePredictions.filter(p=>p.name===name).reduce((s,p)=>s+(p.stake||0),0),
    })).sort((a,b)=>b.stake-a.stake);
    const positionPopularity=[1,2,3].map(pos=>{
      const key=`p${pos}`;
      const counts={};
      activePredictions.forEach(p=>{ const t=p[key]; if(t) counts[t]=(counts[t]||0)+1; });
      const ranked=Object.entries(counts).map(([t,n])=>({t,n})).sort((a,b)=>b.n-a.n).slice(0,3);
      return {pos,ranked};
    });
    // 投票結果確認シートの「報酬一覧」「配当」「収支」に対応する集計。
    // ルールブック【順位決定の優先順位（タイブレーク基準）】に従って、エントリー（口）
    // 全体を1列にランキングし、上位3口が報酬1〜3位（賭けコジー総額の70%/20%/10%）を獲得する。
    // 優勝/準優勝/3位/4位の全てが確定するまでは判定不能。
    const resultDecided = !!(finalResult[1] && finalResult[2] && finalResult[3] && finalResult[4]);
    const best4Set = new Set([finalResult[1],finalResult[2],finalResult[3],finalResult[4]]);
    const rankedEntries = !resultDecided ? [] : activePredictions
      .map((p,idx)=>{
        const picks=[p.p1,p.p2,p.p3,p.p4];
        return {
          ...p, idx,
          champCorrect: p.p1===finalResult[1] ? 1 : 0,                              // ①優勝チームの的中
          finalCard: [p.p1,p.p2].slice().sort().join("|")===[finalResult[1],finalResult[2]].slice().sort().join("|") ? 1 : 0, // ②決勝カードの的中（順不問）
          best4Hits: picks.filter(t=>best4Set.has(t)).length,                       // ③ベスト4チームの的中数
          hasRunnerUp: picks.includes(finalResult[2]) ? 1 : 0,                      // ④より上位のチームの的中（2位>3位>4位）
          hasThird: picks.includes(finalResult[3]) ? 1 : 0,
          hasFourth: picks.includes(finalResult[4]) ? 1 : 0,
          exactMatches: (p.p2===finalResult[2]?1:0)+(p.p3===finalResult[3]?1:0)+(p.p4===finalResult[4]?1:0), // ⑤最終順位のドンピシャ的中数（2〜4位）
        };
      })
      .sort((a,b)=>
        b.champCorrect-a.champCorrect ||
        b.finalCard-a.finalCard ||
        b.best4Hits-a.best4Hits ||
        b.hasRunnerUp-a.hasRunnerUp ||
        b.hasThird-a.hasThird ||
        b.hasFourth-a.hasFourth ||
        b.exactMatches-a.exactMatches ||
        (a.date<b.date?-1:a.date>b.date?1:a.idx-b.idx)                              // ⑥予想の早さ
      );
    const prizes = [
      {label:"1位", amount:totalPool*0.7, entry: rankedEntries[0]||null},
      {label:"2位", amount:totalPool*0.2, entry: rankedEntries[1]||null},
      {label:"3位", amount:totalPool*0.1, entry: rankedEntries[2]||null},
    ];
    const payoutByPerson = name => prizes.reduce((sum,pr)=>
      sum + (pr.entry && pr.entry.name===name ? pr.amount : 0), 0);
    const PersonDetail=({name,onBack})=>{
      const entries=scoredEntries.filter(e=>e.name===name);
      const cols=bp.isDesktop?"1fr 1fr 1fr":bp.isTablet?"1fr 1fr":"1fr";
      return (
        <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
          <button onClick={onBack} style={{alignSelf:"flex-start",padding:"6px 14px",background:"#111d11",border:`1px solid ${T.border}`,borderRadius:"4px",fontFamily:T.font,fontSize:"11px",color:T.muted,cursor:"pointer"}}>← 戻る</button>
          <div style={{fontFamily:T.font,fontSize:"18px",fontWeight:700,color:"#d0eed0"}}>{name}　<span style={{fontSize:"12px",color:T.muted}}>{entries.length}件の全予想</span></div>
          <div style={{display:"grid",gridTemplateColumns:cols,gap:"10px"}}>{entries.map((e,i)=><EntryCard key={i} e={e} rank={i} showRank={false}/>)}</div>
        </div>
      );
    };
    // 詳細画面に入る/戻るときにスクロール位置が前の画面のまま残ってしまい、
    // 詳細の途中から表示されて先頭に戻れないように見えるので、切り替え時に必ず先頭へ戻す。
    useEffect(()=>{ window.scrollTo(0,0); },[selectedPerson]);
    if(selectedPerson) return <PersonDetail name={selectedPerson} onBack={()=>setSP(null)}/>;
    const entryGridCols=bp.isDesktop?"1fr 1fr 1fr":bp.isTablet?"1fr 1fr":"1fr";
    const personGridCols=bp.isDesktop?"1fr 1fr":"1fr";
    return (
      <div style={{display:"flex",flexDirection:"column",gap:"14px"}}>
        <SheetSourcePanel/>
        <div style={{background:T.surface,border:`1px solid ${T.green}33`,borderRadius:"6px",padding:"10px 14px",display:"flex",alignItems:"center",gap:"12px"}}>
          <div style={{fontSize:"22px"}}>📊</div>
          <div>
            <div style={{fontFamily:T.font,fontSize:"10px",letterSpacing:"2px",color:T.muted}}>
              {sheet.mode==="sheet" && sheet.entries ? `Googleスプレッドシート「${sheet.config.activeTab}」より取得` : "投票シートより取得（サンプルデータ・2026/06/22時点）"}
            </div>
            <div style={{fontFamily:T.font,fontSize:"14px",fontWeight:700,color:T.green}}>✓ {activePredictions.length}件のエントリー / {uniqueNames.length}人参加</div>
          </div>
        </div>
        <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:"6px",overflow:"hidden"}}>
          <div style={{background:"#0a120a",padding:"8px 14px",fontFamily:T.font,fontSize:"11px",letterSpacing:"2px",color:T.yellow,fontWeight:700,borderBottom:`1px dashed ${T.yellow}33`}}>🔥 チーム別 被予想数（全{activePredictions.length}件）</div>
          <div style={{padding:"10px",display:"flex",flexWrap:"wrap",gap:"6px"}}>
            {popularity.map(({t,n})=>(
              <div key={t} onClick={()=>setST(t)} style={{display:"flex",alignItems:"center",gap:"5px",padding:"5px 10px",borderRadius:"4px",background:ELIMINATED.has(t)?"rgba(255,68,85,0.07)":STILL_ALIVE.has(t)?"rgba(240,192,64,0.09)":"#111d11",border:`1px solid ${ELIMINATED.has(t)?T.red+"22":STILL_ALIVE.has(t)?T.yellow+"33":T.border}`,opacity:ELIMINATED.has(t)?0.5:1,cursor:"pointer"}}>
                <span style={{fontFamily:T.font,fontSize:"9px",fontWeight:900,color:T.dim,letterSpacing:"0.5px"}}>{f(t)}</span>
                <span style={{fontFamily:T.font,fontSize:"12px",fontWeight:700,color:ELIMINATED.has(t)?T.red:STILL_ALIVE.has(t)?T.yellow:T.muted}}>{nm(t)}</span>
                <span style={{fontFamily:T.font,fontSize:"15px",fontWeight:900,color:ELIMINATED.has(t)?"#553333":STILL_ALIVE.has(t)?T.yellow:T.dim}}>{n}</span>
              </div>
            ))}
          </div>
        </div>
        <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:"6px",overflow:"hidden"}}>
          <div style={{background:"#0a120a",padding:"8px 14px",fontFamily:T.font,fontSize:"11px",letterSpacing:"2px",color:T.yellow,fontWeight:700,display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:`1px dashed ${T.yellow}33`}}>
            <span>💰 賭けコジー額</span>
            <span style={{color:T.green,fontSize:"13px"}}>大会合計 {totalPool.toLocaleString()}コジー</span>
          </div>
          <div style={{padding:"10px",display:"flex",flexWrap:"wrap",gap:"6px"}}>
            {stakeByPerson.map(({name,stake})=>(
              <div key={name} onClick={()=>setSP(name)} style={{display:"flex",alignItems:"center",gap:"6px",padding:"5px 10px",borderRadius:"4px",background:"#111d11",border:`1px solid ${T.border}`,cursor:"pointer"}}>
                <span style={{fontFamily:T.font,fontSize:"12px",fontWeight:700,color:"#d0eed0"}}>{name}</span>
                <span style={{fontFamily:T.font,fontSize:"13px",fontWeight:900,color:stake>0?T.yellow:T.dim}}>{stake.toLocaleString()}</span>
                <span style={{fontFamily:T.font,fontSize:"8px",color:T.muted}}>コジー</span>
              </div>
            ))}
          </div>
          <div style={{padding:"4px 14px 12px",display:"grid",gridTemplateColumns:bp.isDesktop?"1fr 1fr 1fr":"1fr",gap:"8px"}}>
            {positionPopularity.map(({pos,ranked})=>(
              <div key={pos} style={{background:"#0d160d",border:`1px solid ${T.border}`,borderRadius:"5px",padding:"8px 10px"}}>
                <div style={{fontFamily:T.font,fontSize:"10px",letterSpacing:"1px",color:T.muted,marginBottom:"6px"}}>{pos}位予想 人気ランキング</div>
                {ranked.map(({t,n},i)=>(
                  <div key={t} style={{display:"flex",alignItems:"center",gap:"6px",padding:"2px 0"}}>
                    <span style={{fontFamily:T.font,fontSize:"10px",color:T.dim,width:"12px"}}>{i+1}</span>
                    <span style={{fontSize:"13px"}}>{f(t)}</span>
                    <span style={{fontFamily:T.font,fontSize:"11px",fontWeight:700,color:"#d0eed0",flex:1}}>{nm(t)}</span>
                    <span style={{fontFamily:T.font,fontSize:"12px",fontWeight:900,color:T.yellow}}>{n}票</span>
                  </div>
                ))}
              </div>
            ))}
          </div>
        </div>
        <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:"6px",overflow:"hidden"}}>
          <div style={{background:"#0a120a",padding:"8px 14px",fontFamily:T.font,fontSize:"11px",letterSpacing:"2px",color:T.yellow,fontWeight:700,borderBottom:`1px dashed ${T.yellow}33`}}>🏆 報酬一覧（決勝・3位決定戦の結果から自動計算）</div>
          {!resultDecided ? (
            <div style={{padding:"14px",fontFamily:T.font,fontSize:"11px",color:T.muted,lineHeight:1.7}}>
              優勝・準優勝・3位・4位の全てが確定するまでは配当を計算できません（現在：優勝{finalResult[1]?nm(finalResult[1]):"未確定"} / 準優勝{finalResult[2]?nm(finalResult[2]):"未確定"} / 3位{finalResult[3]?nm(finalResult[3]):"未確定"} / 4位{finalResult[4]?nm(finalResult[4]):"未確定"}）。
            </div>
          ):(
            <>
              <div style={{padding:"10px 14px",display:"grid",gridTemplateColumns:bp.isDesktop?"1fr 1fr 1fr":"1fr",gap:"8px"}}>
                {prizes.map(pr=>(
                  <div key={pr.label} style={{background:"#0d160d",border:`1px solid ${T.border}`,borderRadius:"5px",padding:"8px 10px"}}>
                    <div style={{fontFamily:T.font,fontSize:"10px",letterSpacing:"1px",color:T.muted}}>{pr.label}</div>
                    <div style={{fontFamily:T.font,fontSize:"16px",fontWeight:900,color:T.yellow,marginTop:"2px"}}>{pr.amount.toLocaleString()}コジー</div>
                    <div style={{fontFamily:T.font,fontSize:"10px",color:T.dim,marginTop:"2px"}}>
                      {pr.entry ? `${pr.entry.name}（${pr.entry.date}）` : "該当者なし"}
                    </div>
                  </div>
                ))}
              </div>
              <div style={{padding:"4px 10px 12px",display:"flex",flexWrap:"wrap",gap:"6px"}}>
                {uniqueNames.map(name=>{
                  const stake=stakeByPerson.find(s=>s.name===name)?.stake||0;
                  const payout=payoutByPerson(name);
                  const profit=payout-stake;
                  return (
                    <div key={name} onClick={()=>setSP(name)} style={{display:"flex",alignItems:"center",gap:"6px",padding:"5px 10px",borderRadius:"4px",background:"#111d11",border:`1px solid ${T.border}`,cursor:"pointer"}}>
                      <span style={{fontFamily:T.font,fontSize:"12px",fontWeight:700,color:"#d0eed0"}}>{name}</span>
                      <span style={{fontFamily:T.font,fontSize:"12px",fontWeight:900,color:profit>0?T.green:profit<0?T.red:T.dim}}>{profit>0?"+":""}{profit.toLocaleString()}</span>
                      <span style={{fontFamily:T.font,fontSize:"8px",color:T.muted}}>コジー</span>
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:"8px"}}>
          <div style={{fontFamily:T.font,fontSize:"11px",letterSpacing:"2px",color:T.green,fontWeight:700}}>🏅 PLAYERS</div>
          <div style={{display:"flex",border:`1px solid ${T.border}`,borderRadius:"4px",overflow:"hidden"}}>
            {[["person","👤 人別"],["entry","📋 全エントリー"]].map(([key,label])=>(
              <button key={key} onClick={()=>setVM(key)} style={{padding:"6px 14px",border:"none",cursor:"pointer",fontFamily:T.font,fontSize:"11px",fontWeight:700,background:viewMode===key?T.green:"transparent",color:viewMode===key?"#080e08":T.muted}}>{label}</button>
            ))}
          </div>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:"12px",fontFamily:T.font,fontSize:"10px"}}>
          {[{c:T.yellow,l:"生存中（まだ可能性あり）"},{c:T.red,l:"敗退（外れ確定）"},{c:T.green,l:"正解確定"}].map(({c,l})=>(
            <div key={l} style={{display:"flex",alignItems:"center",gap:"5px"}}>
              <div style={{width:"9px",height:"9px",borderRadius:"2px",background:c}}/>
              <span style={{color:T.muted}}>{l}</span>
            </div>
          ))}
        </div>
        {viewMode==="person" && (
          <div style={{display:"grid",gridTemplateColumns:personGridCols,gap:"10px"}}>
            {personRanked.map((person,i)=>(
              <div key={person.name} onClick={()=>setSP(person.name)} style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:"8px",padding:"12px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:"9px"}}>
                <div style={{flex:1,fontFamily:T.font,fontWeight:700,fontSize:"17px",color:"#d0eed0"}}>{person.name}</div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontFamily:T.font,fontWeight:900,fontSize:"24px",color:T.green,lineHeight:1}}>{person.totalEntries}<span style={{fontSize:"11px",color:T.muted,fontWeight:700}}>件</span></div>
                </div>
                <span style={{color:T.dim,fontSize:"14px"}}>›</span>
              </div>
            ))}
          </div>
        )}
        {viewMode==="entry" && (
          <div style={{display:"grid",gridTemplateColumns:entryGridCols,gap:"10px"}}>
            {scoredEntries.map((e,i)=><EntryCard key={e.idx} e={e} rank={i}/>)}
          </div>
        )}
      </div>
    );
  };

  const TeamDetailPanel = ({team, onClose}) => {
    useEffect(()=>{ window.scrollTo(0,0); },[team]);
    const grp = Object.keys(GROUP_TEAMS).find(g=>GROUP_TEAMS[g].includes(team));
    const standing = grp ? sortGroup(GROUP_TEAMS[grp],allStats) : [];
    const rank = standing.findIndex(s=>s.team===team);
    const s = standing[rank];
    const teamGames = games.filter(g=>g.home===team||g.away===team);
    const teamInfo = teams.teams[team];
    const crest = teamInfo?.crest;
    const squad = teamInfo?.squad || [];
    const goalsOf = playerName => scorers.scorers.find(sc=>sc.team===team&&sc.player===playerName)?.goals ?? 0;
    return (
      <div style={{position:"fixed",inset:0,background:"rgba(2,8,2,0.92)",zIndex:200,overflowY:"auto",padding:bp.isDesktop?"40px 24px":"16px"}}>
        <div style={{maxWidth:"640px",margin:"0 auto",display:"flex",flexDirection:"column",gap:"12px"}}>
          <button onClick={onClose} style={{alignSelf:"flex-start",padding:"6px 14px",background:"#111d11",border:`1px solid ${T.border}`,borderRadius:"4px",fontFamily:T.font,fontSize:"11px",color:T.muted,cursor:"pointer"}}>← 閉じる</button>
          <div style={{display:"flex",alignItems:"center",gap:"12px",background:T.surface,border:`1px solid ${T.border}`,borderRadius:"8px",padding:"16px"}}>
            {crest
              ? <img src={crest} alt={team} style={{width:"48px",height:"48px",objectFit:"contain",flexShrink:0}}/>
              : <div style={{fontFamily:T.font,fontSize:"22px",fontWeight:900,color:T.dim,letterSpacing:"1px",padding:"8px 10px",border:`1px solid ${T.border}`,borderRadius:"6px"}}>{f(team)}</div>}
            <div>
              <div style={{fontFamily:T.font,fontWeight:900,fontSize:"20px",color:"#e0ffe0"}}>{nm(team)}</div>
              <div style={{fontFamily:T.font,fontSize:"11px",color:T.dim,marginTop:"2px"}}>
                {team}{grp?` ・ GROUP ${grp}`:""}
                {ELIMINATED.has(team)&&<span style={{color:T.red,marginLeft:"8px"}}>● 敗退</span>}
                {STILL_ALIVE.has(team)&&<span style={{color:T.yellow,marginLeft:"8px"}}>● 生存中</span>}
              </div>
            </div>
          </div>
          {s&&(
            <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:"6px",overflow:"hidden"}}>
              <div style={{background:"#0a120a",padding:"7px 12px",fontFamily:T.font,fontSize:"11px",letterSpacing:"2px",color:T.green,fontWeight:700,borderBottom:`1px dashed ${T.green}33`}}>🚩 GROUP {grp} — {rank+1}位</div>
              <div style={{display:"flex",gap:"10px",padding:"10px 14px",flexWrap:"wrap",fontFamily:T.font,fontSize:"12px",color:"#aacaaa"}}>
                <span>試合 {s.mp}</span><span>勝 {s.w}</span><span>分 {s.d}</span><span>敗 {s.l}</span>
                <span>得失点 {s.gf}-{s.ga}</span><span style={{color:T.green,fontWeight:900}}>勝点 {s.pts}</span>
              </div>
            </div>
          )}
          <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:"6px",overflow:"hidden"}}>
            <div style={{background:"#0a120a",padding:"7px 12px",fontFamily:T.font,fontSize:"11px",letterSpacing:"2px",color:T.green,fontWeight:700,borderBottom:`1px dashed ${T.green}33`}}>⚽ MATCHES</div>
            {teamGames.length===0
              ?<div style={{padding:"16px",color:T.dim,textAlign:"center",fontSize:"12px"}}>試合データなし</div>
              :teamGames.map((g,i)=><MatchRow key={i} game={g}/>)}
          </div>
          <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:"6px",overflow:"hidden"}}>
            <div style={{background:"#0a120a",padding:"7px 12px",fontFamily:T.font,fontSize:"11px",letterSpacing:"2px",color:T.green,fontWeight:700,borderBottom:`1px dashed ${T.green}33`}}>👥 SQUAD</div>
            {squad.length===0
              ?<div style={{padding:"16px",color:T.dim,textAlign:"center",fontSize:"12px"}}>選手一覧は現在取得できません</div>
              :<table style={{width:"100%",borderCollapse:"collapse",fontSize:"12px"}}>
                <thead><tr style={{background:"#111d11"}}>
                  {["PLAYER","POSITION","GOALS"].map(h=>(
                    <th key={h} style={{padding:"5px 6px",color:T.muted,fontFamily:T.font,fontWeight:700,letterSpacing:"1px",fontSize:"10px",textAlign:h==="PLAYER"?"left":"center",borderBottom:`1px solid ${T.border}`}}>{h}</th>

  const tabBtn = (key,label) => (
    <button key={key} onClick={()=>setTab(key)} style={{padding:"10px 0",flex:1,border:"none",cursor:"pointer",fontFamily:T.font,fontSize:bp.isDesktop?"13px":"12px",fontWeight:700,letterSpacing:"1.5px",background:tab===key?"#0e1a0e":"transparent",color:tab===key?T.green:T.muted,borderBottom:tab===key?`2px solid ${T.green}`:"2px solid transparent",transition:"all 0.15s"}}>{label}</button>
  );

  return (
    <div style={{minHeight:"100vh",background:"transparent"}}>
      {selectedTeam&&<TeamDetailPanel team={selectedTeam} onClose={()=>setST(null)}/>}
      <div ref={headerRef} style={{background:"rgba(10,18,10,0.88)",borderBottom:`2px solid ${T.green}`,padding:bp.isDesktop?"14px 24px":"12px 14px",position:"sticky",top:0,zIndex:100,overflow:"hidden"}}>
        {/* ピッチのセンターサークル＋ハーフウェイラインを模した、ごく薄い装飾。

        <div aria-hidden="true" style={{position:"absolute",inset:0,pointerEvents:"none",opacity:0.5}}>

            {tabBtn("bracket","🏆 トーナメント")}

      </div>
      <div style={{maxWidth:"1200px",margin:"0 auto",padding:bp.isDesktop?"20px 24px":"12px"}}>
        {tab==="pred"&&<PredTab/>}
        {tab==="group"&&<GroupTab/>}
        {tab==="bracket"&&<BracketTab/>}
        {tab==="schedule"&&<ScheduleTab/>}
        {tab==="scorers"&&<ScorersTab/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
