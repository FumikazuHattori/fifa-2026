name: Update World Cup scores

# schedule実行がしばらく発火していない状態が確認できたため、ワークフローファイルへの
# コミットを挟んでGitHub側のスケジューラを再アクティブ化する。
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch latest scores
        env:
          FD_API_TOKEN: ${{ secrets.FD_API_TOKEN }}
        run: node scripts/update-scores.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.json
          if ! git diff --staged --quiet; then
            git commit -m "Update World Cup scores [skip ci]"
            for i in 1 2 3 4 5; do
              git push && break
              git fetch origin main
              git rebase origin/main
              sleep $((i * 3))
            done
          fi
